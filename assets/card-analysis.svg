<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 176" width="440" height="176" role="img" aria-label="File Analysis Service — FastAPI, YARA, Celery, CAPE sandbox. Private repository.">
  <defs>
    <linearGradient id="bs" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff" stop-opacity="0"/><stop offset="50%" stop-color="#ffffff" stop-opacity="0.6"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <clipPath id="c7"><rect x="0.5" y="0.5" width="439" height="175" rx="12"/></clipPath>
    <pattern id="p7" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2a323d" fill-opacity="0.4"/>
    </pattern>
    <style>
      @keyframes crise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes cgrow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
      @keyframes cping { 0% { r: 4; opacity: .5; } 70% { r: 10; opacity: 0; } 100% { r: 10; opacity: 0; } }
      @keyframes cshine { 0% { transform: translateY(-64px); } 55%, 100% { transform: translateY(176px); } }
      @keyframes ctrace { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -1207.4; } }
      .r  { opacity: 0; animation: crise .55s cubic-bezier(.2,.75,.3,1) forwards; }
      .d1 { animation-delay: 0.50s } .d2 { animation-delay: 0.58s }
      .d3 { animation-delay: 0.66s } .d4 { animation-delay: 0.76s }
      .bar  { transform-box: view-box; transform-origin: 0 0; animation: cgrow .6s 0.42s cubic-bezier(.2,.75,.3,1) both; }
      .ping  { animation: cping 3s ease-out infinite; }
      .shine { animation: cshine 6s 4.7s ease-in-out infinite; }
      .tr    { animation: ctrace 9s 7.5s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        .r, .bar { opacity: 1; transform: none; animation: none; }
        .ping, .shine, .tr { animation: none; opacity: 0; }
      }
    </style>
  </defs>
  <g clip-path="url(#c7)">
    <rect width="440" height="176" fill="#0a0c10"/>
    <rect width="440" height="176" fill="url(#p7)"/>
    <circle cx="416" cy="0" r="92" fill="#9b8bc4" fill-opacity="0.055"/>
    <rect class="bar" x="0" y="0" width="3" height="176" fill="#9b8bc4"/>
    <rect class="shine" x="0" y="0" width="3" height="64" fill="url(#bs)"/>
  </g>
  <rect x="0.5" y="0.5" width="439" height="175" rx="12" fill="none" stroke="#1e242c"/>
  <rect class="tr" x="0.5" y="0.5" width="439" height="175" rx="12" fill="none" stroke="#9b8bc4" stroke-width="3" stroke-opacity="0.16" stroke-dasharray="70 1137.4" stroke-linecap="round"/>
  <rect class="tr" x="0.5" y="0.5" width="439" height="175" rx="12" fill="none" stroke="#9b8bc4" stroke-width="1.4" stroke-opacity="0.75" stroke-dasharray="70 1137.4" stroke-linecap="round"/>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <circle class="ping" cx="382" cy="26" r="4" fill="#d4a259"/><circle cx="382" cy="26" r="3.5" fill="#d4a259"/>
    <text x="428" y="30" font-size="9" fill="#6d7683" text-anchor="end">PRIVATE</text>

    <text class="r d1" x="24" y="46" font-size="15.5" font-weight="700" fill="#e8edf4">File Analysis Service</text>
    <text class="r d1" x="24" y="64" font-size="9.5" fill="#9b8bc4" letter-spacing="1.1">SECURITY · ASYNC PIPELINE</text>

    <text class="r d2" x="24" y="92" font-size="10.5" fill="#8792a2">Scans uploads with YARA, parses PE headers, submits to a</text>
    <text class="r d2" x="24" y="109" font-size="10.5" fill="#8792a2">CAPE sandbox through a Celery queue. A bare except was</text>
    <text class="r d3" x="24" y="126" font-size="10.5" fill="#8792a2">making broken rules report every sample as clean.</text>

    <g class="r d4" font-size="9" fill="#8792a2">
      <rect x="24"  y="142" width="62" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="55"  y="155.5" text-anchor="middle">FastAPI</text>
      <rect x="92"  y="142" width="48" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="116" y="155.5" text-anchor="middle">YARA</text>
      <rect x="146" y="142" width="54" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="173" y="155.5" text-anchor="middle">Celery</text>
      <rect x="206" y="142" width="48" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="230" y="155.5" text-anchor="middle">CAPE</text>
      <rect x="260" y="142" width="54" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="287" y="155.5" text-anchor="middle">Docker</text>
    </g>
  </g>
</svg>
