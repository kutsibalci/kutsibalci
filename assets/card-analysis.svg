<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 168" width="440" height="168" role="img" aria-label="File Analysis Service — FastAPI, YARA, Celery, Docker (private)">
  <defs>
    <clipPath id="ca"><rect x="0.5" y="0.5" width="439" height="167" rx="12"/></clipPath>
    <pattern id="ga" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30363d" fill-opacity="0.4"/>
    </pattern>
  </defs>
  <g clip-path="url(#ca)">
    <rect width="440" height="168" fill="#0d1117"/>
    <rect width="440" height="168" fill="url(#ga)"/>
    <circle cx="410" cy="6" r="86" fill="#d2a8ff" fill-opacity="0.06"/>
    <rect x="0" y="0" width="4" height="168" fill="#d2a8ff"/>
  </g>
  <rect x="0.5" y="0.5" width="439" height="167" rx="12" fill="none" stroke="#30363d"/>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <circle cx="386" cy="26" r="3" fill="#8b949e"/>
    <text x="428" y="30" font-size="9" fill="#6e7681" text-anchor="end">PRIVATE</text>

    <text x="24" y="42" font-size="16" font-weight="700" fill="#e6edf3">File Analysis Service</text>
    <text x="24" y="60" font-size="10" fill="#d2a8ff" letter-spacing="1">STATIC · DYNAMIC ANALYSIS</text>

    <text x="24" y="88" font-size="11" fill="#8b949e">YARA rule matching and PE parsing, queued through</text>
    <text x="24" y="105" font-size="11" fill="#8b949e">Redis to Celery workers so untrusted files never touch</text>
    <text x="24" y="122" font-size="11" fill="#8b949e">the request path. CAPE sandbox for behaviour.</text>

    <g font-size="9" fill="#8b949e">
      <rect x="24"  y="136" width="60" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="54"  y="148" text-anchor="middle">FastAPI</text>
      <rect x="90"  y="136" width="46" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="113" y="148" text-anchor="middle">YARA</text>
      <rect x="142" y="136" width="52" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="168" y="148" text-anchor="middle">Celery</text>
      <rect x="200" y="136" width="54" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="227" y="148" text-anchor="middle">Docker</text>
    </g>
  </g>
</svg>
