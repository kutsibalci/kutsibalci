<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 176" width="440" height="176" role="img" aria-label="Kurye Rota — React Native, Expo, offline Turkish address parsing, TSP solver. Private repository.">
  <defs>
    <linearGradient id="bs" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff" stop-opacity="0"/><stop offset="50%" stop-color="#ffffff" stop-opacity="0.6"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <clipPath id="c5"><rect x="0.5" y="0.5" width="439" height="175" rx="12"/></clipPath>
    <pattern id="p5" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2a323d" fill-opacity="0.4"/>
    </pattern>
    <style>
      @keyframes crise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes cgrow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
      @keyframes cping { 0% { r: 4; opacity: .5; } 70% { r: 10; opacity: 0; } 100% { r: 10; opacity: 0; } }
      @keyframes cshine { 0% { transform: translateY(-64px); } 55%, 100% { transform: translateY(176px); } }
      .r  { opacity: 0; animation: crise .55s cubic-bezier(.2,.75,.3,1) forwards; }
      .d1 { animation-delay: 0.36s } .d2 { animation-delay: 0.44s }
      .d3 { animation-delay: 0.52s } .d4 { animation-delay: 0.62s }
      .bar  { transform-box: view-box; transform-origin: 0 0; animation: cgrow .6s 0.28s cubic-bezier(.2,.75,.3,1) both; }
      .ping  { animation: cping 3s ease-out infinite; }
      .shine { animation: cshine 6s 3.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .r, .bar { opacity: 1; transform: none; animation: none; }
        .ping, .shine { animation: none; opacity: 0; }
      }
    </style>
  </defs>
  <g clip-path="url(#c5)">
    <rect width="440" height="176" fill="#0a0c10"/>
    <rect width="440" height="176" fill="url(#p5)"/>
    <circle cx="416" cy="0" r="92" fill="#d4a259" fill-opacity="0.055"/>
    <rect class="bar" x="0" y="0" width="3" height="176" fill="#d4a259"/>
    <rect class="shine" x="0" y="0" width="3" height="64" fill="url(#bs)"/>
  </g>
  <rect x="0.5" y="0.5" width="439" height="175" rx="12" fill="none" stroke="#1e242c"/>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <circle class="ping" cx="382" cy="26" r="4" fill="#d4a259"/><circle cx="382" cy="26" r="3.5" fill="#d4a259"/>
    <text x="428" y="30" font-size="9" fill="#6d7683" text-anchor="end">PRIVATE</text>

    <text class="r d1" x="24" y="46" font-size="15.5" font-weight="700" fill="#e8edf4">Kurye Rota</text>
    <text class="r d1" x="24" y="64" font-size="9.5" fill="#d4a259" letter-spacing="1.1">MOBILE · ROUTING · OFFLINE</text>

    <text class="r d2" x="24" y="92" font-size="10.5" fill="#8792a2">Couriers paste addresses out of WhatsApp. Parses free-form</text>
    <text class="r d2" x="24" y="109" font-size="10.5" fill="#8792a2">Turkish addresses offline — 81 provinces, 50k districts —</text>
    <text class="r d3" x="24" y="126" font-size="10.5" fill="#8792a2">then orders the stops. 10 stops: 44.3 km → 14.6 km.</text>

    <g class="r d4" font-size="9" fill="#8792a2">
      <rect x="24"  y="142" width="90" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="69"  y="155.5" text-anchor="middle">React Native</text>
      <rect x="120" y="142" width="46" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="143" y="155.5" text-anchor="middle">Expo</text>
      <rect x="172" y="142" width="76" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="210" y="155.5" text-anchor="middle">geocoding</text>
      <rect x="254" y="142" width="72" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="290" y="155.5" text-anchor="middle">TSP 2-opt</text>
    </g>
  </g>
</svg>
