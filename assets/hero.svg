<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="Hüseyin Kutsi Balcı — Backend Development Student at Anadolu University">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#79c0ff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#79c0ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#79c0ff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#79c0ff"/>
      <stop offset="60%" stop-color="#7ee787"/>
      <stop offset="100%" stop-color="#d2a8ff"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30363d" fill-opacity="0.55"/>
    </pattern>
    <clipPath id="card">
      <rect x="0.5" y="0.5" width="899" height="229" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="230" fill="#0d1117"/>
    <rect width="900" height="230" fill="url(#grid)"/>
    <circle cx="720" cy="30" r="180" fill="#79c0ff" fill-opacity="0.045"/>
    <circle cx="820" cy="200" r="130" fill="#7ee787" fill-opacity="0.035"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="229" rx="14" fill="none" stroke="#30363d"/>
  <rect x="0" y="0" width="900" height="3" fill="url(#accent)" clip-path="url(#card)"/>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <text x="48" y="72" font-size="13" fill="#8b949e" letter-spacing="2.5">BACKEND · DEVELOPMENT</text>

    <text x="48" y="118" font-size="34" font-weight="700" fill="#e6edf3">Hüseyin Kutsi Balcı</text>

    <rect x="48" y="134" width="54" height="3" rx="1.5" fill="url(#accent)"/>

    <text x="48" y="166" font-size="15" fill="#79c0ff">ASP.NET&#160;Core · FastAPI · PostgreSQL · Docker</text>
    <text x="48" y="192" font-size="13" fill="#8b949e">Anadolu University — Eskişehir, Türkiye</text>
  </g>

  <!-- request path diagram -->
  <g transform="translate(596, 66)">
    <path id="flow" d="M 24 42 H 236" stroke="url(#edge)" stroke-width="1.5" fill="none"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#8b949e" text-anchor="middle">
      <g>
        <rect x="0" y="26" width="48" height="32" rx="7" fill="#161b22" stroke="#30363d"/>
        <text x="24" y="46" fill="#e6edf3">client</text>
        <text x="24" y="76">HTTP</text>
      </g>
      <g>
        <rect x="106" y="26" width="48" height="32" rx="7" fill="#161b22" stroke="#79c0ff" stroke-opacity="0.5"/>
        <text x="130" y="46" fill="#79c0ff">api</text>
        <text x="130" y="76">REST</text>
      </g>
      <g>
        <rect x="212" y="26" width="48" height="32" rx="7" fill="#161b22" stroke="#30363d"/>
        <text x="236" y="46" fill="#e6edf3">db</text>
        <text x="236" y="76">SQL</text>
      </g>
    </g>

    <circle r="3" fill="#7ee787">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M 24 42 H 236"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
