<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 168" width="440" height="168" role="img" aria-label="Coffee Shop Management — C#, Windows Forms, MySQL">
  <defs>
    <clipPath id="cf"><rect x="0.5" y="0.5" width="439" height="167" rx="12"/></clipPath>
    <pattern id="gf" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30363d" fill-opacity="0.4"/>
    </pattern>
  </defs>
  <g clip-path="url(#cf)">
    <rect width="440" height="168" fill="#0d1117"/>
    <rect width="440" height="168" fill="url(#gf)"/>
    <circle cx="410" cy="6" r="86" fill="#ffa657" fill-opacity="0.06"/>
    <rect x="0" y="0" width="4" height="168" fill="#ffa657"/>
  </g>
  <rect x="0.5" y="0.5" width="439" height="167" rx="12" fill="none" stroke="#30363d"/>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <circle cx="392" cy="26" r="3" fill="#3fb950"/>
    <text x="428" y="30" font-size="9" fill="#6e7681" text-anchor="end">PUBLIC</text>

    <text x="24" y="42" font-size="16" font-weight="700" fill="#e6edf3">Coffee Shop Management</text>
    <text x="24" y="60" font-size="10" fill="#ffa657" letter-spacing="1">DESKTOP · POINT OF SALE</text>

    <text x="24" y="88" font-size="11" fill="#8b949e">Windows Forms till for taking orders and tracking</text>
    <text x="24" y="105" font-size="11" fill="#8b949e">tables, with a separate manager panel behind a login,</text>
    <text x="24" y="122" font-size="11" fill="#8b949e">backed by MySQL.</text>

    <g font-size="9" fill="#8b949e">
      <rect x="24"  y="136" width="34" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="41"  y="148" text-anchor="middle">C#</text>
      <rect x="64"  y="136" width="76" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="102" y="148" text-anchor="middle">WinForms</text>
      <rect x="146" y="136" width="52" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="172" y="148" text-anchor="middle">MySQL</text>
      <rect x="204" y="136" width="56" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="232" y="148" text-anchor="middle">.NET FW</text>
    </g>
  </g>
