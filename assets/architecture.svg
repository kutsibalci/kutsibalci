<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Course Registration System architecture: browser to ASP.NET Core MVC controllers, view models and views, through Entity Framework Core to SQLite">
  <defs>
    <pattern id="g3" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30363d" fill-opacity="0.4"/>
    </pattern>
    <clipPath id="c3"><rect x="0.5" y="0.5" width="899" height="319" rx="14"/></clipPath>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#484f58"/>
    </marker>
  </defs>

  <g clip-path="url(#c3)">
    <rect width="900" height="320" fill="#0d1117"/>
    <rect width="900" height="320" fill="url(#g3)"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="319" rx="14" fill="none" stroke="#30363d"/>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <text x="36" y="44" font-size="12" fill="#8b949e" letter-spacing="2.5">FEATURED — COURSE REGISTRATION SYSTEM</text>
    <line x1="36" y1="58" x2="864" y2="58" stroke="#21262d"/>

    <!-- actors -->
    <g font-size="11">
      <rect x="36" y="96" width="122" height="46" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="97" y="118" fill="#e6edf3" text-anchor="middle" font-size="12">Student</text>
      <text x="97" y="133" fill="#6e7681" text-anchor="middle">browse · apply</text>

      <rect x="36" y="176" width="122" height="46" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="97" y="198" fill="#e6edf3" text-anchor="middle" font-size="12">Administrator</text>
      <text x="97" y="213" fill="#6e7681" text-anchor="middle">manage · review</text>
    </g>

    <path d="M 162 119 H 214" stroke="#484f58" stroke-width="1.2" marker-end="url(#arw)" fill="none"/>
    <path d="M 162 199 H 214" stroke="#484f58" stroke-width="1.2" marker-end="url(#arw)" fill="none"/>

    <!-- app layer -->
    <rect x="222" y="80" width="330" height="180" rx="10" fill="#0f1620" stroke="#79c0ff" stroke-opacity="0.35"/>
    <text x="240" y="102" font-size="11" fill="#79c0ff" letter-spacing="1.5">ASP.NET CORE MVC</text>

    <g font-size="11" fill="#e6edf3">
      <rect x="240" y="116" width="140" height="38" rx="7" fill="#161b22" stroke="#30363d"/>
      <text x="310" y="132" text-anchor="middle">Controllers</text>
      <text x="310" y="146" text-anchor="middle" font-size="9" fill="#6e7681">Account · Kurs · Basvuru</text>

      <rect x="394" y="116" width="140" height="38" rx="7" fill="#161b22" stroke="#30363d"/>
      <text x="464" y="132" text-anchor="middle">Admin Area</text>
      <text x="464" y="146" text-anchor="middle" font-size="9" fill="#6e7681">courses · instructors</text>

      <rect x="240" y="168" width="140" height="38" rx="7" fill="#161b22" stroke="#30363d"/>
      <text x="310" y="184" text-anchor="middle">ViewModels</text>
      <text x="310" y="198" text-anchor="middle" font-size="9" fill="#6e7681">validation</text>

      <rect x="394" y="168" width="140" height="38" rx="7" fill="#161b22" stroke="#30363d"/>
      <text x="464" y="184" text-anchor="middle">Razor Views</text>
      <text x="464" y="198" text-anchor="middle" font-size="9" fill="#6e7681">shared layout</text>
    </g>
    <text x="240" y="236" font-size="10" fill="#6e7681">Public catalogue and authenticated admin area kept separate</text>

    <path d="M 556 170 H 610" stroke="#484f58" stroke-width="1.2" marker-end="url(#arw)" fill="none"/>

    <!-- data layer -->
    <rect x="618" y="80" width="246" height="180" rx="10" fill="#0f1620" stroke="#7ee787" stroke-opacity="0.3"/>
    <text x="636" y="102" font-size="11" fill="#7ee787" letter-spacing="1.5">PERSISTENCE</text>

    <g font-size="11" fill="#e6edf3">
      <rect x="636" y="116" width="210" height="38" rx="7" fill="#161b22" stroke="#30363d"/>
      <text x="741" y="132" text-anchor="middle">Entity Framework Core</text>
      <text x="741" y="146" text-anchor="middle" font-size="9" fill="#6e7681">AppDbContext · migrations</text>

      <rect x="636" y="168" width="210" height="38" rx="7" fill="#161b22" stroke="#30363d"/>
      <text x="741" y="184" text-anchor="middle">SQLite</text>
      <text x="741" y="198" text-anchor="middle" font-size="9" fill="#6e7681">Kurs · Ogrenci · Egitmen · Basvuru</text>
    </g>
    <text x="636" y="236" font-size="10" fill="#6e7681">Code-first schema, versioned in source control</text>

    <line x1="36" y1="284" x2="864" y2="284" stroke="#21262d"/>
    <text x="36" y="304" font-size="11" fill="#6e7681">C# · .NET 10 · EF Core · Razor — github.com/kutsibalci/Course-Registration-System</text>
  </g>
</svg>
