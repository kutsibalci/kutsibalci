<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 168" width="440" height="168" role="img" aria-label="Business Data Panel — FastAPI, SQLAlchemy, Pydantic">
  <defs>
    <clipPath id="cd"><rect x="0.5" y="0.5" width="439" height="167" rx="12"/></clipPath>
    <pattern id="gd" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30363d" fill-opacity="0.4"/>
    </pattern>
  </defs>
  <g clip-path="url(#cd)">
    <rect width="440" height="168" fill="#0d1117"/>
    <rect width="440" height="168" fill="url(#gd)"/>
    <circle cx="410" cy="6" r="86" fill="#7ee787" fill-opacity="0.06"/>
    <rect x="0" y="0" width="4" height="168" fill="#7ee787"/>
  </g>
  <rect x="0.5" y="0.5" width="439" height="167" rx="12" fill="none" stroke="#30363d"/>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <circle cx="392" cy="26" r="3" fill="#3fb950"/>
    <text x="428" y="30" font-size="9" fill="#6e7681" text-anchor="end">PUBLIC</text>

    <text x="24" y="42" font-size="16" font-weight="700" fill="#e6edf3">Business Data Panel</text>
    <text x="24" y="60" font-size="10" fill="#7ee787" letter-spacing="1">FASTAPI · REST</text>

    <text x="24" y="88" font-size="11" fill="#8b949e">Paginated REST API over a normalised province and</text>
    <text x="24" y="105" font-size="11" fill="#8b949e">district schema, with cascading filters, validated page</text>
    <text x="24" y="122" font-size="11" fill="#8b949e">sizes and streamed Excel export.</text>

    <g font-size="9" fill="#8b949e">
      <rect x="24"  y="136" width="54" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="51"  y="148" text-anchor="middle">Python</text>
      <rect x="84"  y="136" width="82" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="125" y="148" text-anchor="middle">SQLAlchemy</text>
      <rect x="172" y="136" width="64" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="204" y="148" text-anchor="middle">Pydantic</text>
      <rect x="242" y="136" width="54" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="269" y="148" text-anchor="middle">pandas</text>
    </g>
  </g>
</svg>
