<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="File Analysis Service architecture: upload to FastAPI, queued through Redis to a Celery worker running YARA and PE static analysis plus CAPE sandbox, results stored in MySQL">
  <defs>
    <pattern id="g4" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30363d" fill-opacity="0.4"/>
    </pattern>
    <clipPath id="c4"><rect x="0.5" y="0.5" width="899" height="329" rx="14"/></clipPath>
    <marker id="arw2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#484f58"/>
    </marker>
  </defs>

  <g clip-path="url(#c4)">
    <rect width="900" height="330" fill="#0d1117"/>
    <rect width="900" height="330" fill="url(#g4)"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="329" rx="14" fill="none" stroke="#30363d"/>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <text x="36" y="44" font-size="12" fill="#8b949e" letter-spacing="2.5">FILE ANALYSIS SERVICE — PRIVATE</text>
    <line x1="36" y1="58" x2="864" y2="58" stroke="#21262d"/>

    <!-- row 1: request path -->
    <g font-size="11">
      <rect x="36" y="86" width="104" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="88" y="106" fill="#e6edf3" text-anchor="middle" font-size="12">upload</text>
      <text x="88" y="121" fill="#6e7681" text-anchor="middle">multipart</text>

      <rect x="184" y="86" width="120" height="44" rx="8" fill="#161b22" stroke="#79c0ff" stroke-opacity="0.5"/>
      <text x="244" y="106" fill="#79c0ff" text-anchor="middle" font-size="12">FastAPI</text>
      <text x="244" y="121" fill="#6e7681" text-anchor="middle">returns 202</text>

      <rect x="348" y="86" width="104" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="400" y="106" fill="#e6edf3" text-anchor="middle" font-size="12">Redis</text>
      <text x="400" y="121" fill="#6e7681" text-anchor="middle">broker</text>

      <rect x="496" y="86" width="126" height="44" rx="8" fill="#161b22" stroke="#7ee787" stroke-opacity="0.5"/>
      <text x="559" y="106" fill="#7ee787" text-anchor="middle" font-size="12">Celery worker</text>
      <text x="559" y="121" fill="#6e7681" text-anchor="middle">off request thread</text>
    </g>

    <path d="M 144 108 H 178"  stroke="#484f58" stroke-width="1.2" marker-end="url(#arw2)" fill="none"/>
    <path d="M 308 108 H 342"  stroke="#484f58" stroke-width="1.2" marker-end="url(#arw2)" fill="none"/>
    <path d="M 456 108 H 490"  stroke="#484f58" stroke-width="1.2" marker-end="url(#arw2)" fill="none"/>

    <circle r="3" fill="#7ee787">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M 144 108 H 490"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>

    <!-- row 2: analysis stages -->
    <path d="M 559 136 V 168" stroke="#484f58" stroke-width="1.2" marker-end="url(#arw2)" fill="none"/>

    <rect x="288" y="176" width="544" height="86" rx="10" fill="#0f1620" stroke="#d2a8ff" stroke-opacity="0.3"/>
    <text x="308" y="198" font-size="11" fill="#d2a8ff" letter-spacing="1.5">ANALYSIS STAGES</text>

    <g font-size="11" fill="#e6edf3">
      <rect x="308" y="210" width="150" height="38" rx="7" fill="#161b22" stroke="#30363d"/>
      <text x="383" y="226" text-anchor="middle">YARA matching</text>
      <text x="383" y="240" text-anchor="middle" font-size="9" fill="#6e7681">custom rule set</text>

      <rect x="472" y="210" width="150" height="38" rx="7" fill="#161b22" stroke="#30363d"/>
      <text x="547" y="226" text-anchor="middle">PE parsing</text>
      <text x="547" y="240" text-anchor="middle" font-size="9" fill="#6e7681">headers · architecture</text>

      <rect x="636" y="210" width="176" height="38" rx="7" fill="#161b22" stroke="#30363d"/>
      <text x="724" y="226" text-anchor="middle">CAPE sandbox</text>
      <text x="724" y="240" text-anchor="middle" font-size="9" fill="#6e7681">behavioural, isolated</text>
    </g>

    <!-- storage -->
    <path d="M 288 219 H 200" stroke="#484f58" stroke-width="1.2" marker-end="url(#arw2)" fill="none"/>
    <rect x="36" y="197" width="158" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="115" y="217" fill="#e6edf3" text-anchor="middle" font-size="12">MySQL</text>
    <text x="115" y="232" fill="#6e7681" text-anchor="middle" font-size="11">verdict · threat score</text>

    <line x1="36" y1="288" x2="864" y2="288" stroke="#21262d"/>
    <text x="36" y="308" font-size="11" fill="#6e7681">FastAPI · Celery · Redis · MySQL · YARA · pefile · Docker Compose — source kept private while in development</text>
  </g>
</svg>
