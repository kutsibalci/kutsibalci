<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 176" width="440" height="176" role="img" aria-label="Ön Muhasebe ve Lojistik Takibi — Node.js, SQLite, UBL-TR e-invoice. Private repository, in development with real users.">
  <defs>
    <clipPath id="c3"><rect x="0.5" y="0.5" width="439" height="175" rx="12"/></clipPath>
    <pattern id="p3" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2a323d" fill-opacity="0.4"/>
    </pattern>
    <style>
      @keyframes crise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes cgrow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
      @keyframes cping { 0% { r: 4; opacity: .5; } 70% { r: 10; opacity: 0; } 100% { r: 10; opacity: 0; } }
      .r  { opacity: 0; animation: crise .55s cubic-bezier(.2,.75,.3,1) forwards; }
      .d1 { animation-delay: .08s } .d2 { animation-delay: .16s }
      .d3 { animation-delay: .24s } .d4 { animation-delay: .34s }
      .bar  { transform-box: view-box; transform-origin: 0 0; animation: cgrow .6s cubic-bezier(.2,.75,.3,1) forwards; }
      .ping { animation: cping 3s ease-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .r, .bar { opacity: 1; transform: none; animation: none; }
        .ping { animation: none; opacity: 0; }
      }
    </style>
  </defs>
  <g clip-path="url(#c3)">
    <rect width="440" height="176" fill="#0a0c10"/>
    <rect width="440" height="176" fill="url(#p3)"/>
    <circle cx="416" cy="0" r="92" fill="#7fb069" fill-opacity="0.055"/>
    <rect class="bar" x="0" y="0" width="3" height="176" fill="#7fb069"/>
  </g>
  <rect x="0.5" y="0.5" width="439" height="175" rx="12" fill="none" stroke="#1e242c"/>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <circle class="ping" cx="382" cy="26" r="4" fill="#d4a259"/><circle cx="382" cy="26" r="3.5" fill="#d4a259"/>
    <text x="428" y="30" font-size="9" fill="#6d7683" text-anchor="end">PRIVATE</text>

    <text class="r d1" x="24" y="46" font-size="15.5" font-weight="700" fill="#e8edf4">Ön Muhasebe ve Lojistik</text>
    <text class="r d1" x="24" y="64" font-size="9.5" fill="#7fb069" letter-spacing="1.1">IN DEVELOPMENT · HAS REAL USERS</text>

    <text class="r d2" x="24" y="92" font-size="10.5" fill="#8792a2">Trips, fuel and vehicle papers on one side; accounts,</text>
    <text class="r d2" x="24" y="109" font-size="10.5" fill="#8792a2">UBL-TR invoices and collections on the other. Runs from</text>
    <text class="r d3" x="24" y="126" font-size="10.5" fill="#8792a2">a copied folder — no install, no registry, no network.</text>

    <g class="r d4" font-size="9" fill="#8792a2">
      <rect x="24"  y="142" width="60" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="54"  y="155.5" text-anchor="middle">Node.js</text>
      <rect x="90"  y="142" width="54" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="117" y="155.5" text-anchor="middle">SQLite</text>
      <rect x="150" y="142" width="58" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="179" y="155.5" text-anchor="middle">UBL-TR</text>
      <rect x="214" y="142" width="66" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="247" y="155.5" text-anchor="middle">e-Fatura</text>
      <rect x="286" y="142" width="94" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="333" y="155.5" text-anchor="middle">zero install</text>
    </g>
  </g>
</svg>
