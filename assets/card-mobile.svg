<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 168" width="440" height="168" role="img" aria-label="Mobile applications — Flutter and React Native, offline-first (private)">
  <defs>
    <clipPath id="mb"><rect x="0.5" y="0.5" width="439" height="167" rx="12"/></clipPath>
    <pattern id="gm" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30363d" fill-opacity="0.4"/>
    </pattern>
  </defs>
  <g clip-path="url(#mb)">
    <rect width="440" height="168" fill="#0d1117"/>
    <rect width="440" height="168" fill="url(#gm)"/>
    <circle cx="410" cy="6" r="86" fill="#56d4dd" fill-opacity="0.06"/>
    <rect x="0" y="0" width="4" height="168" fill="#56d4dd"/>
  </g>
  <rect x="0.5" y="0.5" width="439" height="167" rx="12" fill="none" stroke="#30363d"/>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <circle cx="392" cy="26" r="3" fill="#8b949e"/>
    <text x="428" y="30" font-size="9" fill="#6e7681" text-anchor="end">PRIVATE</text>

    <text x="24" y="42" font-size="16" font-weight="700" fill="#e6edf3">Mobile — four applications</text>
    <text x="24" y="60" font-size="10" fill="#56d4dd" letter-spacing="1">FLUTTER · REACT NATIVE · OFFLINE-FIRST</text>

    <text x="24" y="88" font-size="11" fill="#8b949e">A multi-exam engine shipping one codebase as several</text>
    <text x="24" y="105" font-size="11" fill="#8b949e">store listings, a driver logbook, offline Turkish address</text>
    <text x="24" y="122" font-size="11" fill="#8b949e">parsing for couriers, and a story player for children.</text>

    <g font-size="9" fill="#8b949e">
      <rect x="24"  y="136" width="52" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="50"  y="148" text-anchor="middle">Flutter</text>
      <rect x="82"  y="136" width="42" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="103" y="148" text-anchor="middle">Dart</text>
      <rect x="130" y="136" width="46" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="153" y="148" text-anchor="middle">Expo</text>
      <rect x="182" y="136" width="52" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="208" y="148" text-anchor="middle">SQLite</text>
      <rect x="240" y="136" width="60" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="270" y="148" text-anchor="middle">Flavors</text>
    </g>
  </g>
</svg>
