<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 176" width="440" height="176" role="img" aria-label="Life Gate — browser-based first aid serious game with on-device adaptive difficulty. Private repository.">
  <defs>
    <clipPath id="c8"><rect x="0.5" y="0.5" width="439" height="175" rx="12"/></clipPath>
    <pattern id="p8" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2a323d" fill-opacity="0.4"/>
    </pattern>
  </defs>
  <g clip-path="url(#c8)">
    <rect width="440" height="176" fill="#0a0c10"/>
    <rect width="440" height="176" fill="url(#p8)"/>
    <circle cx="416" cy="0" r="92" fill="#9b8bc4" fill-opacity="0.055"/>
    <rect x="0" y="0" width="3" height="176" fill="#9b8bc4"/>
  </g>
  <rect x="0.5" y="0.5" width="439" height="175" rx="12" fill="none" stroke="#1e242c"/>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <circle cx="382" cy="26" r="3.5" fill="#d4a259"/>
    <text x="428" y="30" font-size="9" fill="#6d7683" text-anchor="end">PRIVATE</text>

    <text x="24" y="46" font-size="15.5" font-weight="700" fill="#e8edf4">Life Gate</text>
    <text x="24" y="64" font-size="9.5" fill="#9b8bc4" letter-spacing="1.1">SERIOUS GAME · RESEARCH</text>

    <text x="24" y="92" font-size="10.5" fill="#8792a2">First aid training for bleeding, in the browser. Difficulty</text>
    <text x="24" y="109" font-size="10.5" fill="#8792a2">adapts to the learner from a rule-based competence model</text>
    <text x="24" y="126" font-size="10.5" fill="#8792a2">running on-device — no server, no network, works offline.</text>

    <g font-size="9" fill="#8792a2">
      <rect x="24"  y="142" width="88" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="68"  y="155.5" text-anchor="middle">JavaScript</text>
      <rect x="118" y="142" width="94" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="165" y="155.5" text-anchor="middle">psychometrics</text>
      <rect x="218" y="142" width="78" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="257" y="155.5" text-anchor="middle">on-device</text>
      <rect x="302" y="142" width="58" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="331" y="155.5" text-anchor="middle">offline</text>
    </g>
