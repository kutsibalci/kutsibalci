<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 168" width="440" height="168" role="img" aria-label="Redmine Deployment — Docker Compose, PostgreSQL, AWS EC2">
  <defs>
    <clipPath id="cr"><rect x="0.5" y="0.5" width="439" height="167" rx="12"/></clipPath>
    <pattern id="gr" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30363d" fill-opacity="0.4"/>
    </pattern>
  </defs>
  <g clip-path="url(#cr)">
    <rect width="440" height="168" fill="#0d1117"/>
    <rect width="440" height="168" fill="url(#gr)"/>
    <circle cx="410" cy="6" r="86" fill="#56d4dd" fill-opacity="0.06"/>
    <rect x="0" y="0" width="4" height="168" fill="#56d4dd"/>
  </g>
  <rect x="0.5" y="0.5" width="439" height="167" rx="12" fill="none" stroke="#30363d"/>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <circle cx="392" cy="26" r="3" fill="#3fb950"/>
    <text x="428" y="30" font-size="9" fill="#6e7681" text-anchor="end">PUBLIC</text>

    <text x="24" y="42" font-size="16" font-weight="700" fill="#e6edf3">Redmine Deployment</text>
    <text x="24" y="60" font-size="10" fill="#56d4dd" letter-spacing="1">DOCKER · SELF-HOSTED</text>

    <text x="24" y="88" font-size="11" fill="#8b949e">Redmine and PostgreSQL orchestrated with Compose</text>
    <text x="24" y="105" font-size="11" fill="#8b949e">and deployed to an AWS EC2 host, with custom plugins</text>
    <text x="24" y="122" font-size="11" fill="#8b949e">and themes. Built with Atakan MERGEN.</text>

    <g font-size="9" fill="#8b949e">
      <rect x="24"  y="136" width="54" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="51"  y="148" text-anchor="middle">Docker</text>
      <rect x="84"  y="136" width="74" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="121" y="148" text-anchor="middle">PostgreSQL</text>
      <rect x="164" y="136" width="60" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="194" y="148" text-anchor="middle">AWS EC2</text>
      <rect x="230" y="136" width="42" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="251" y="148" text-anchor="middle">Ruby</text>
    </g>
  </g>
</svg>
