<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 176" width="440" height="176" role="img" aria-label="Redmine 7 Plugins — Ruby on Rails, PostgreSQL, Docker Compose. Internship project at Anadolu University BAUM. Private repository.">
  <defs>
    <linearGradient id="bs" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff" stop-opacity="0"/><stop offset="50%" stop-color="#ffffff" stop-opacity="0.6"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <clipPath id="c2"><rect x="0.5" y="0.5" width="439" height="175" rx="12"/></clipPath>
    <pattern id="p2" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2a323d" fill-opacity="0.4"/>
    </pattern>
    <style>
      @keyframes cgrow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
      @keyframes cping { 0% { r: 4; opacity: .5; } 70% { r: 10; opacity: 0; } 100% { r: 10; opacity: 0; } }
      @keyframes cshine { 0% { transform: translateY(-64px); } 55%, 100% { transform: translateY(176px); } }
      @keyframes ctrace { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -1207.4; } }
      .bar  { transform-box: view-box; transform-origin: 0 0; animation: cgrow .6s 0.07s cubic-bezier(.2,.75,.3,1) forwards; }
      .ping  { animation: cping 3s ease-out infinite; }
      .shine { animation: cshine 6s 1.9s ease-in-out infinite; }
      .tr    { animation: ctrace 9s 0.9s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        .bar { transform: none; animation: none; }
        .ping, .shine, .tr { animation: none; opacity: 0; }
      }
    </style>
  </defs>
  <g clip-path="url(#c2)">
    <rect width="440" height="176" fill="#0a0c10"/>
    <rect width="440" height="176" fill="url(#p2)"/>
    <circle cx="416" cy="0" r="92" fill="#d0666a" fill-opacity="0.055"/>
    <rect class="bar" x="0" y="0" width="3" height="176" fill="#d0666a"/>
    <rect class="shine" x="0" y="0" width="3" height="64" fill="url(#bs)"/>
  </g>
  <rect x="0.5" y="0.5" width="439" height="175" rx="12" fill="none" stroke="#1e242c"/>
  <rect class="tr" x="0.5" y="0.5" width="439" height="175" rx="12" fill="none" stroke="#d0666a" stroke-width="3" stroke-opacity="0.16" stroke-dasharray="70 1137.4" stroke-linecap="round"/>
  <rect class="tr" x="0.5" y="0.5" width="439" height="175" rx="12" fill="none" stroke="#d0666a" stroke-width="1.4" stroke-opacity="0.75" stroke-dasharray="70 1137.4" stroke-linecap="round"/>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <circle class="ping" cx="382" cy="26" r="4" fill="#d4a259"/><circle cx="382" cy="26" r="3.5" fill="#d4a259"/>
    <text x="428" y="30" font-size="9" fill="#6d7683" text-anchor="end">PRIVATE</text>

    <text class="r d1" x="24" y="46" font-size="15.5" font-weight="700" fill="#e8edf4">Redmine 7 Plugins</text>
    <text class="r d1" x="24" y="64" font-size="9.5" fill="#d0666a" letter-spacing="1.1">INTERNSHIP · BAUM · ANADOLU UNIVERSITY</text>

    <text class="r d2" x="24" y="92" font-size="10.5" fill="#8792a2">Thirteen plugins that turn Redmine into a Jira-style tracker:</text>
    <text class="r d2" x="24" y="109" font-size="10.5" fill="#8792a2">identity, screens, workflows, audit log, search, a board.</text>
    <text class="r d3" x="24" y="126" font-size="10.5" fill="#8792a2">Seven written during my summer 2026 internship at BAUM.</text>

    <g class="r d4" font-size="9" fill="#8792a2">
      <rect x="24" y="142" width="44" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="46" y="155.5" text-anchor="middle">Ruby</text>
      <rect x="74" y="142" width="60" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="104" y="155.5" text-anchor="middle">Rails 8</text>
      <rect x="140" y="142" width="77" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="178.5" y="155.5" text-anchor="middle">PostgreSQL</text>
      <rect x="223" y="142" width="55" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="250.5" y="155.5" text-anchor="middle">Docker</text>
      <rect x="284" y="142" width="82" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="325" y="155.5" text-anchor="middle">61/61 smoke</text>
    </g>
  </g>
</svg>
