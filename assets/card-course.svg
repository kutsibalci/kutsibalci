<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 168" width="440" height="168" role="img" aria-label="Course Registration System — ASP.NET Core MVC, EF Core, SQLite">
  <defs>
    <clipPath id="cc"><rect x="0.5" y="0.5" width="439" height="167" rx="12"/></clipPath>
    <pattern id="gc" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30363d" fill-opacity="0.4"/>
    </pattern>
  </defs>
  <g clip-path="url(#cc)">
    <rect width="440" height="168" fill="#0d1117"/>
    <rect width="440" height="168" fill="url(#gc)"/>
    <circle cx="410" cy="6" r="86" fill="#79c0ff" fill-opacity="0.06"/>
    <rect x="0" y="0" width="4" height="168" fill="#79c0ff"/>
  </g>
  <rect x="0.5" y="0.5" width="439" height="167" rx="12" fill="none" stroke="#30363d"/>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <circle cx="392" cy="26" r="3" fill="#3fb950"/>
    <text x="404" y="30" font-size="9" fill="#6e7681" text-anchor="end" transform="translate(24,0)">PUBLIC</text>

    <text x="24" y="42" font-size="16" font-weight="700" fill="#e6edf3">Course Registration System</text>
    <text x="24" y="60" font-size="10" fill="#79c0ff" letter-spacing="1">ASP.NET CORE MVC</text>

    <text x="24" y="88" font-size="11" fill="#8b949e">Students browse a catalogue and apply; admins manage</text>
    <text x="24" y="105" font-size="11" fill="#8b949e">courses, instructors and applications from a separate</text>
    <text x="24" y="122" font-size="11" fill="#8b949e">authenticated area. Code-first EF Core migrations.</text>

    <g font-size="9" fill="#8b949e">
      <rect x="24"  y="136" width="34" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="41"  y="148" text-anchor="middle">C#</text>
      <rect x="64"  y="136" width="60" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="94"  y="148" text-anchor="middle">EF Core</text>
      <rect x="130" y="136" width="54" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="157" y="148" text-anchor="middle">SQLite</text>
      <rect x="190" y="136" width="48" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="214" y="148" text-anchor="middle">Razor</text>
    </g>
  </g>
</svg>
