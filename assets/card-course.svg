      <rect x="196" y="142" width="54" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="223" y="155.5" text-anchor="middle">SQLite</text>
      <rect x="256" y="142" width="62" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="287" y="155.5" text-anchor="middle">62 tests</text>
