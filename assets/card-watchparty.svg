<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 176" width="440" height="176" role="img" aria-label="Watch Party Sync Engine — TypeScript, Redis Lua, WebRTC, ffmpeg. Public repository.">
  <defs>
    <clipPath id="c2"><rect x="0.5" y="0.5" width="439" height="175" rx="12"/></clipPath>
    <pattern id="p2" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2a323d" fill-opacity="0.4"/>
    </pattern>
    <style>
      @keyframes crise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes cgrow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
      @keyframes cping { 0% { r: 4; opacity: .5; } 70% { r: 10; opacity: 0; } 100% { r: 10; opacity: 0; } }
      .r  { opacity: 0; animation: crise .55s cubic-bezier(.2,.75,.3,1) forwards; }
      .d1 { animation-delay: .08s } .d2 { animation-delay: .16s }
      .d3 { animation-delay: .24s } .d4 { animation-delay: .34s }
      .bar  { transform-box: view-box; transform-origin: 0 0; animation: cgrow .6s cubic-bezier(.2,.75,.3,1) forwards; }
      .ping { animation: cping 3s ease-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .r, .bar { opacity: 1; transform: none; animation: none; }
        .ping { animation: none; opacity: 0; }
      }
    </style>
  </defs>
  <g clip-path="url(#c2)">
    <rect width="440" height="176" fill="#0a0c10"/>
    <rect width="440" height="176" fill="url(#p2)"/>
    <circle cx="416" cy="0" r="92" fill="#4db6ac" fill-opacity="0.055"/>
    <rect class="bar" x="0" y="0" width="3" height="176" fill="#4db6ac"/>
  </g>
  <rect x="0.5" y="0.5" width="439" height="175" rx="12" fill="none" stroke="#1e242c"/>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <circle class="ping" cx="390" cy="26" r="4" fill="#3fb950"/><circle cx="390" cy="26" r="3.5" fill="#3fb950"/>
    <text x="428" y="30" font-size="9" fill="#6d7683" text-anchor="end">PUBLIC</text>

    <text class="r d1" x="24" y="46" font-size="15.5" font-weight="700" fill="#e8edf4">Watch Party Sync Engine</text>
    <text class="r d1" x="24" y="64" font-size="9.5" fill="#4db6ac" letter-spacing="1.1">REAL-TIME · P2P · SCALING</text>

    <text class="r d2" x="24" y="92" font-size="10.5" fill="#8792a2">Thousands of sockets agreeing on one room's state.</text>
    <text class="r d2" x="24" y="109" font-size="10.5" fill="#8792a2">Redis Lua for atomic transitions, WebRTC mesh for media.</text>
    <text class="r d3" x="24" y="126" font-size="10.5" fill="#8792a2">2 instances at 2,500 conns: p95 258 ms → 14 ms.</text>

    <g class="r d4" font-size="9" fill="#8792a2">
      <rect x="24"  y="142" width="74" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="61"  y="155.5" text-anchor="middle">TypeScript</text>
      <rect x="104" y="142" width="70" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="139" y="155.5" text-anchor="middle">Redis Lua</text>
      <rect x="180" y="142" width="60" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="210" y="155.5" text-anchor="middle">WebRTC</text>
      <rect x="246" y="142" width="52" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="272" y="155.5" text-anchor="middle">ffmpeg</text>
      <rect x="304" y="142" width="70" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="339" y="155.5" text-anchor="middle">104 tests</text>
    </g>
  </g>
</svg>
