<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 168" width="440" height="168" role="img" aria-label="Watch Party Sync Engine — TypeScript, Redis Lua, ffmpeg, WebSocket">
  <defs>
    <clipPath id="cw"><rect x="0.5" y="0.5" width="439" height="167" rx="12"/></clipPath>
    <pattern id="gw" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30363d" fill-opacity="0.4"/>
    </pattern>
  </defs>
  <g clip-path="url(#cw)">
    <rect width="440" height="168" fill="#0d1117"/>
    <rect width="440" height="168" fill="url(#gw)"/>
    <circle cx="410" cy="6" r="86" fill="#ff7b72" fill-opacity="0.06"/>
    <rect x="0" y="0" width="4" height="168" fill="#ff7b72"/>
  </g>
  <rect x="0.5" y="0.5" width="439" height="167" rx="12" fill="none" stroke="#30363d"/>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <circle cx="392" cy="26" r="3" fill="#3fb950"/>
    <text x="404" y="30" font-size="9" fill="#6e7681" text-anchor="end" transform="translate(24,0)">PUBLIC</text>

    <text x="24" y="42" font-size="16" font-weight="700" fill="#e6edf3">Watch Party Sync Engine</text>
    <text x="24" y="60" font-size="10" fill="#ff7b72" letter-spacing="1">REAL-TIME · NODE 24</text>

    <text x="24" y="88" font-size="11" fill="#8b949e">One instance saturates at 2,500 connections — 258 ms</text>
    <text x="24" y="105" font-size="11" fill="#8b949e">p95. Two instances: 14 ms. Room state in Redis Lua, a</text>
    <text x="24" y="122" font-size="11" fill="#8b949e">hand-written job queue, ffmpeg HLS transcoding.</text>

    <g font-size="9" fill="#8b949e">
      <rect x="24"  y="136" width="76" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="62"  y="148" text-anchor="middle">TypeScript</text>
      <rect x="108" y="136" width="70" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="143" y="148" text-anchor="middle">Redis Lua</text>
      <rect x="186" y="136" width="52" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="212" y="148" text-anchor="middle">ffmpeg</text>
      <rect x="246" y="136" width="70" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="281" y="148" text-anchor="middle">WebSocket</text>
    </g>
  </g>
</svg>
