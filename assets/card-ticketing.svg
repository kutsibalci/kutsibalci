<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 168" width="440" height="168" role="img" aria-label="Concurrent Ticketing — .NET 10, PostgreSQL, RabbitMQ, Redis">
  <defs>
    <clipPath id="ct"><rect x="0.5" y="0.5" width="439" height="167" rx="12"/></clipPath>
    <pattern id="gt" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30363d" fill-opacity="0.4"/>
    </pattern>
  </defs>
  <g clip-path="url(#ct)">
    <rect width="440" height="168" fill="#0d1117"/>
    <rect width="440" height="168" fill="url(#gt)"/>
    <circle cx="410" cy="6" r="86" fill="#ffdf5d" fill-opacity="0.06"/>
    <rect x="0" y="0" width="4" height="168" fill="#ffdf5d"/>
  </g>
  <rect x="0.5" y="0.5" width="439" height="167" rx="12" fill="none" stroke="#30363d"/>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <circle cx="392" cy="26" r="3" fill="#3fb950"/>
    <text x="404" y="30" font-size="9" fill="#6e7681" text-anchor="end" transform="translate(24,0)">PUBLIC</text>

    <text x="24" y="42" font-size="16" font-weight="700" fill="#e6edf3">Concurrent Ticketing</text>
    <text x="24" y="60" font-size="10" fill="#ffdf5d" letter-spacing="1">MINIMAL API · .NET 10</text>

    <text x="24" y="88" font-size="11" fill="#8b949e">Twenty concurrent requests for one seat: one 201 and</text>
    <text x="24" y="105" font-size="11" fill="#8b949e">nineteen 409s. PostgreSQL xmin as a concurrency token,</text>
    <text x="24" y="122" font-size="11" fill="#8b949e">and a transactional outbox so no event is lost.</text>

    <g font-size="9" fill="#8b949e">
      <rect x="24"  y="136" width="56" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="52"  y="148" text-anchor="middle">.NET 10</text>
      <rect x="88"  y="136" width="72" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="124" y="148" text-anchor="middle">PostgreSQL</text>
      <rect x="168" y="136" width="62" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="199" y="148" text-anchor="middle">RabbitMQ</text>
      <rect x="238" y="136" width="46" height="18" rx="9" fill="#161b22" stroke="#30363d"/><text x="261" y="148" text-anchor="middle">Redis</text>
    </g>
  </g>
</svg>
