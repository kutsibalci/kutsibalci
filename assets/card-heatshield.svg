<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 176" width="440" height="176" role="img" aria-label="HeatShield — Python, FastAPI, Nokia Network as Code (CAMARA). Top 10 finalist, GSMA MENA Ignite Hackathon 2026. Public repository.">
  <defs>
    <linearGradient id="bs" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff" stop-opacity="0"/><stop offset="50%" stop-color="#ffffff" stop-opacity="0.6"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <clipPath id="c2"><rect x="0.5" y="0.5" width="439" height="175" rx="12"/></clipPath>
    <pattern id="p2" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2a323d" fill-opacity="0.4"/>
    </pattern>
    <style>
      @keyframes cgrow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
      @keyframes cping { 0% { r: 4; opacity: .5; } 70% { r: 10; opacity: 0; } 100% { r: 10; opacity: 0; } }
      @keyframes cshine { 0% { transform: translateY(-64px); } 55%, 100% { transform: translateY(176px); } }
      @keyframes ctrace { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -1207.4; } }
      .bar  { transform-box: view-box; transform-origin: 0 0; animation: cgrow .6s 0.07s cubic-bezier(.2,.75,.3,1) forwards; }
      .ping  { animation: cping 3s ease-out infinite; }
      .shine { animation: cshine 6s 1.9s ease-in-out infinite; }
      .tr    { animation: ctrace 9s 0.9s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        .bar { transform: none; animation: none; }
        .ping, .shine, .tr { animation: none; opacity: 0; }
      }
    </style>
  </defs>
  <g clip-path="url(#c2)">
    <rect width="440" height="176" fill="#0a0c10"/>
    <rect width="440" height="176" fill="url(#p2)"/>
    <circle cx="416" cy="0" r="92" fill="#e08a4f" fill-opacity="0.055"/>
    <rect class="bar" x="0" y="0" width="3" height="176" fill="#e08a4f"/>
    <rect class="shine" x="0" y="0" width="3" height="64" fill="url(#bs)"/>
  </g>
  <rect x="0.5" y="0.5" width="439" height="175" rx="12" fill="none" stroke="#1e242c"/>
  <rect class="tr" x="0.5" y="0.5" width="439" height="175" rx="12" fill="none" stroke="#e08a4f" stroke-width="3" stroke-opacity="0.16" stroke-dasharray="70 1137.4" stroke-linecap="round"/>
  <rect class="tr" x="0.5" y="0.5" width="439" height="175" rx="12" fill="none" stroke="#e08a4f" stroke-width="1.4" stroke-opacity="0.75" stroke-dasharray="70 1137.4" stroke-linecap="round"/>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <circle class="ping" cx="390" cy="26" r="4" fill="#3fb950"/><circle cx="390" cy="26" r="3.5" fill="#3fb950"/>
    <text x="428" y="30" font-size="9" fill="#6d7683" text-anchor="end">PUBLIC</text>

    <text class="r d1" x="24" y="46" font-size="15.5" font-weight="700" fill="#e8edf4">HeatShield</text>
    <text class="r d1" x="24" y="64" font-size="9.5" fill="#e08a4f" letter-spacing="1.1">TOP 10 OF 1,348 · GSMA MENA IGNITE 2026</text>

    <text class="r d2" x="24" y="92" font-size="10.5" fill="#8792a2">Heat-stress agent that uses the mobile network as the sensor.</text>
    <text class="r d2" x="24" y="109" font-size="10.5" fill="#8792a2">Past the legal WBGT limit it spends a fixed query budget on</text>
    <text class="r d3" x="24" y="126" font-size="10.5" fill="#8792a2">the workers most at risk. Solo build, pitched to the jury live.</text>

    <g class="r d4" font-size="9" fill="#8792a2">
      <rect x="24" y="142" width="55" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="51.5" y="155.5" text-anchor="middle">Python</text>
      <rect x="85" y="142" width="60" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="115" y="155.5" text-anchor="middle">FastAPI</text>
      <rect x="151" y="142" width="55" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="178.5" y="155.5" text-anchor="middle">CAMARA</text>
      <rect x="212" y="142" width="82" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="253" y="155.5" text-anchor="middle">6 live APIs</text>
      <rect x="300" y="142" width="71" height="20" rx="10" fill="#12151b" stroke="#232a33"/><text x="335.5" y="155.5" text-anchor="middle">130 tests</text>
    </g>
  </g>
</svg>
